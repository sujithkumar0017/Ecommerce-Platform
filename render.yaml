# ============================================================================
#  ShopKart — Render Blueprint (BACKENDS + DATABASE only; free tier)
#
#  Architecture: the two React frontends deploy to NETLIFY; the two Express
#  APIs and the shared PostgreSQL run here on Render. This file provisions:
#    * shopkart-db            PostgreSQL (shared by both APIs)
#    * shopkart-ecommerce-api Express API   (ecommerce-app/server)
#    * shopkart-admin-api     Express API   (admin-app/server)
#  (The frontends are configured via ecommerce-app/client/netlify.toml and
#   admin-app/client/netlify.toml — see DEPLOY.md.)
#
#  Deploy: push to GitHub, then Render → New → Blueprint → pick the repo.
#
#  IMPORTANT — CLIENT_URL below must equal your NETLIFY site URLs (used for CORS).
#  The values here are PREDICTIONS; after you create the Netlify sites, set the
#  real URLs and Render will restart the APIs automatically. Likewise, the APIs'
#  own *.onrender.com URLs go into the Netlify VITE_API_URL settings.
#
#  Free-tier notes:
#    * Web services sleep after ~15 min idle; first request then wakes them (~30-50s).
#    * Free Postgres is deleted after 30 days (fine for a sub-month test).
# ============================================================================

databases:
  - name: shopkart-db
    databaseName: shopkart
    user: shopkart
    plan: free

services:
  # ────────────────────────────  ECOMMERCE API  ────────────────────────────
  - type: web
    name: shopkart-ecommerce-api
    runtime: node
    plan: free
    rootDir: ecommerce-app
    # db:migrate is idempotent (CREATE TABLE IF NOT EXISTS) — safe on every deploy.
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: shopkart-db
          property: connectionString
      - key: CLIENT_URL
        value: https://shopkart-ecommerce.netlify.app

  # ──────────────────────────────  ADMIN API  ──────────────────────────────
  - type: web
    name: shopkart-admin-api
    runtime: node
    plan: free
    rootDir: admin-app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: shopkart-db
          property: connectionString
      - key: CLIENT_URL
        value: https://shopkart-admin.netlify.app
      - key: ECOMMERCE_APP_URL
        value: https://shopkart-ecommerce.netlify.app

  # Frontends are NOT here — they deploy to Netlify (see the netlify.toml files
  # in ecommerce-app/client and admin-app/client, and DEPLOY.md).
